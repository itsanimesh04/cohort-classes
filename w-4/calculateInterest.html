<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" placeholder="Principal Amount"></input> <br><br>
    <input type="text" placeholder="Rate of Interest"></input> <br><br>
    <input type="text" placeholder="Time (in years)"></input> <br><br>
    <button>Calculate Interest</button>         
    <p id="interest"></p>
    <script>
        //calculate interest
        const button = document.querySelector('button');
        button.addEventListener('click', function() {
            const inputs = document.querySelectorAll('input');
            const principal = parseFloat(inputs[0].value);
            const rate = parseFloat(inputs[1].value);
            const time = parseFloat(inputs[2].value);
            //fetch api to calculate interest
            //https://sum-server.100xdev.com/interest?principal=1000&rate=5&time=2
            const calculateInterest = async () => {
                try {
                    const response = await fetch(`https://sum-server.100xdev.com/interest?principal=${principal}&rate=${rate}&time=${time}`);
                    const interest = await response.text();
                    const interestParagraph = document.getElementById('interest');
                    interestParagraph.innerHTML = `<strong>Interest:</strong> ${interest}`;
                } catch (error) {
                    console.error("Error fetching interest:", error);
                }
            }
        });
    </script>
</body>
</html>
