<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" placeholder="first number"></input> <br><br>
    <input type="text" placeholder="second number"></input> <br><br>
    <button>Calculate Sum</button>
    <p class="sum"></p>

    <script>
        // fetch("https://sum-server.100xdev.com/sum)
        const button = document.querySelector('button');
        button.addEventListener('click',()=>{
            const inputs = document.querySelectorAll('input');
            const num1 = parseFloat(inputs[0].value);
            const num2 = parseFloat(inputs[1].value);
            const sum = async()=>{
                try {
                    const reponse = await fetch(`https://sum-server.100xdev.com/sum?a=${num1}&b=${num2}`);
                    const ans = await reponse.text();
                    const sumParagraph = document.getElementsByClassName('sum')[0];
                    sumParagraph.innerHTML = `<strong>Sum:</strong> ${ans}`;
                } catch (error) {
                    console.error("Error fetching sum:", error);
                }
            }
        })
    </script>
</body>
</html>
